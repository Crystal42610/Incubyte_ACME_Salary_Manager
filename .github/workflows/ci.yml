name: Test and validate
on:
  push:
  pull_request:
jobs:
  backend-and-ui-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build maintained React 19 frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Syntax-check bundled browser JavaScript
        run: node --check frontend/dist/app.js
      - name: Docker build
        run: docker build -t acme-salary-manager:test .
